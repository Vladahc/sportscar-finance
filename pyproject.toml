[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportscar-finance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.11,<4",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
    "numpy>=2.0",
    "tzdata>=2024.1",
    "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
